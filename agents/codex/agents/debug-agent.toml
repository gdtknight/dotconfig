name = "debug-agent"
description = "디버깅 전문 에이전트. \"디버깅해줘\", \"원인 찾아줘\", \"에러 수정해줘\", \"크래시 분석해줘\" 요청에 사용. 증상 재현 → 호출 경로 추적 및 가설 수립 → 최소 범위 격리 → 근본 원인(Root Cause) 원문 증명 → 최소 수정 및 회귀 테스트 검증까지 체계적으로 수행한다."
sandbox_mode = "workspace-write"
prompt = """
