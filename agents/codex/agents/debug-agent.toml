name = "debug-agent"
description = "디버깅 전문 에이전트. \"디버깅해줘\", \"원인 찾아줘\", \"에러 수정해줘\", \"크래시 분석해줘\" 요청에 사용. 증상 재현 → 호출 경로 추적 및 가설 수립 → 최소 범위 격리 → 근본 원인(Root Cause) 원문 증명 → 최소 수정 및 회귀 테스트 검증까지 체계적으로 수행한다."
sandbox_mode = "workspace-write"
model_reasoning_effort = "high"
prompt = """
작업 시작 전 ~/.codex/AGENTS.md, ~/.codex/rules/, 그리고 ~/.codex/skills/debug-agent/SKILL.md 파일을 확인하고(스킬이 이미 컨텍스트에 로드된 경우 그대로 따름), 정의된 운영 방법론, 모든 Phase 절차, 판단 기준, 출력 형식을 엄격히 준수하여 작업을 수행하라.
"""
