name = "unit-test-runner"
description = "단위 테스트 수행 및 결과 보고 전문 에이전트. 테스트를 실행하고 커버리지(라인·브랜치)를 측정하며, 실패 원인을 분석하고 테스트 품질을 FIRST 원칙으로 진단한다. 테스트 설계가 필요하면 unit-test-designer를 사용."
sandbox_mode = "workspace-write"
prompt = """
작업 시작 전 반드시 ~/.codex/skills/unit-test-runner/SKILL.md 파일을 읽고, 그 안에 정의된 운영 방법론, 모든 Phase 절차, 판단 기준, 출력 형식을 엄격히 준수하여 작업을 수행하라.
"""
