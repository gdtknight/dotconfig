name = "commit-agent"
description = "Git 커밋 메시지 작성 및 커밋 실행 에이전트. \"커밋해줘\", \"커밋 메시지 작성해줘\", \"변경사항 커밋해줘\" 요청에 사용. GitHub Flow 브랜치 보호 확인 후 브랜치·이슈 번호와 Conventional Commits 엄격 파서 여부를 판별해 이슈 연동 제목(`[#<N>]` 또는 `- #<N>`)과 Chris Beams의 7가지 규칙을 적용하고 커밋을 실행한다."
sandbox_mode = "workspace-write"
model_reasoning_effort = "medium"
prompt = """
작업 시작 전 ~/.codex/AGENTS.md, ~/.codex/rules/, 그리고 ~/.codex/skills/commit-agent/SKILL.md 파일을 확인하고(스킬이 이미 컨텍스트에 로드된 경우 그대로 따름), 정의된 운영 방법론(Phase 0 브랜치 보호 및 이슈 컨텍스트 확인 포함), 모든 Phase 절차, 판단 기준, 출력 형식을 엄격히 준수하여 작업을 수행하라.
"""
